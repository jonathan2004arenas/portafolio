
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de administrador</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .admin-auth {
            max-width: 420px;
            margin: 10vh auto;
            padding: 2rem;
            border: 1px solid #8884;
            border-radius: 16px;
        }
        .admin-auth form {
            display: grid;
            gap: 1rem;
        }
        .admin-auth input {
            width: 100%;
            padding: .8rem;
            box-sizing: border-box;
        }
        .admin-auth button {
            padding: .8rem 1rem;
            cursor: pointer;
        }
        .admin-message {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="admin-auth">
        <h1>Panel de administración</h1>
        <p>Inicia sesión para administrar tu portafolio.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="admin-message" role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="password">Contraseña de administrador</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                autofocus
            >

            <button type="submit">Iniciar sesión</button>
        </form>

        <p>
            <a href="{{ url_for('main.home') }}">Volver al portafolio</a>
        </p>
    </main>
</body>
</html>
